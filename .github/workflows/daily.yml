name: World Guide V3
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-guide-data-v3
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline
        run: python -m unittest discover -s tests -v
      - name: Restore V3 rolling store (fail closed on restore errors)
        id: restore
        run: python persistence.py restore
      - name: Collect complete pool and rank comparable differences
        id: collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_ANALYTICS_APPROVAL_CONFIRMED: ${{ vars.YOUTUBE_ANALYTICS_APPROVAL_CONFIRMED }}
        run: python tracker.py
      - name: Save rolling store and quota ledger even after collection failure
        if: always() && steps.restore.outcome == 'success'
        id: save
        run: python persistence.py save
      - name: Downloadable report copy
        if: steps.collect.outcome == 'success' && steps.save.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: world-guide-v3-data
          path: data/
          retention-days: 2
          if-no-files-found: error
