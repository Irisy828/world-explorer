name: Daily World Guide
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-guide-daily
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline
        run: python -m unittest discover -s tests -v
      - name: Restore durable rolling snapshots
        id: restore
        run: python persistence.py restore
      - name: Collect public metadata and generate review reports
        id: collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collector.py
      - name: Persist and prune even if collection fails
        if: always() && steps.restore.outcome == 'success'
        run: python persistence.py save
      - name: Downloadable review copy (not the history store)
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: world-guide-data
          path: data/
          retention-days: 2
          if-no-files-found: error
